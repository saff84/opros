name: sanext-survey
services:
  app:
    build: .
    image: sanext-survey:local
    restart: unless-stopped
    init: true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      DATABASE_PATH: /data/survey.sqlite
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3000"
    volumes:
      - survey_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backup:
    image: sanext-survey:local
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["node", "scripts/backup-worker.mjs"]
    healthcheck:
      disable: true
    healthcheck:
      disable: true
    environment:
      DATABASE_PATH: /data/survey.sqlite
    volumes:
      - survey_data:/data
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  survey_data:
